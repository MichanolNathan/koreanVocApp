# Déploiement production — la base (SQLite) vit dans ./data sur l'hôte (sauvegarder avant chaque `up`).
# IMAGE permet de surcharger le nom d'image utilisé (défaut : myflashcardapp:latest).
services:
  app:
    image: ${IMAGE:-myflashcardapp:latest}
    container_name: myflashcardapp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
