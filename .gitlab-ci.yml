# CI/CD GitLab : tests → image Docker (Container Registry) → déploiement VPS.
#
# Variables CI/CD à définir (Settings > CI/CD > Variables, protégées + masquées) :
#   DEPLOY_HOST              — hôte du VPS (ex. vps.example.com)
#   DEPLOY_USER              — utilisateur SSH de déploiement
#   DEPLOY_PATH              — répertoire de déploiement (ex. /opt/myflashcardapp)
#   SSH_PRIVATE_KEY          — clé privée OpenSSH du déploiement (type « File » recommandé)
#   REGISTRY_TOKEN_USER      — nom d'un deploy token projet avec rôle read_registry
#   REGISTRY_TOKEN_PASSWORD  — mot de passe de ce deploy token (pull depuis le VPS)
#
# Le job token ($CI_REGISTRY_PASSWORD) sert au push depuis la CI ; le VPS a besoin
# d'un token dédié car le job token est révoqué à la fin du pipeline.

stages: [test, image, deploy]

default:
  interruptible: true

test:server:
  stage: test
  image: node:22-alpine
  cache:
    key: server-npm
    paths:
      - server/node_modules
  script:
    - cd server
    - npm ci
    - npm test

build-image:
  stage: image
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

deploy:production:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - cat "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # 1. Préparer le VPS : répertoire, login registry (mot de passe par stdin), pull de l'image.
    - echo "$REGISTRY_TOKEN_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "mkdir -p '$DEPLOY_PATH' && cd '$DEPLOY_PATH' &&
       docker login -u '$REGISTRY_TOKEN_USER' --password-stdin '$CI_REGISTRY' &&
       docker pull '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA'"
    # 2. Composer le service avec la version exacte du commit.
    - scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    # 3. Sauvegarder la base, puis basculer (down propre → up) et nettoyer les vieilles images.
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd '$DEPLOY_PATH' &&
       if [ -f data/app.db ]; then cp data/app.db \"data/backup-\$(date +%Y%m%d-%H%M%S).app.db\"; fi &&
       IMAGE='$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA' docker compose up -d --remove-orphans &&
       docker image prune -f"
  environment:
    name: production
    url: http://$DEPLOY_HOST:3001
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
