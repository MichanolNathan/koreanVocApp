# Release build — après fusion d'une release sur main : build des deux images,
# smoke test du conteneur, puis publication sur GHCR.
#   - push de main (fusion de PR)  → ghcr.io/<owner>/<repo>/myflashcardapp:latest
#   - push d'un tag vX.Y.Z         → …:X.Y.Z + :latest
name: release-build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag d'image (tag git vX.Y.Z → X.Y.Z, sinon latest)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=latest" >> "$GITHUB_ENV"
          fi

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image de données (base SQLite initiale)
        run: docker build -f Dockerfile.db -t myflashcardapp/db .

      - name: Build de l'image applicative
        run: |
          image="$(echo "ghcr.io/${{ github.repository }}/myflashcardapp" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -t "$image:$version" -t "$image:latest" .

      - name: Smoke test avant publication
        run: ./scripts/docker-smoke.sh "$IMAGE:$version"

      - name: Publication sur GHCR
        run: |
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
